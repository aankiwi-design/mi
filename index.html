<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Kelulusan Siswa</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f6f8;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: #fff;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

h1 {
    text-align: center;
    margin-bottom: 8px;
    color: #222;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #333;
}

input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
    margin-bottom: 18px;
    font-size: 15px;
}

input:focus {
    border-color: #555;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #333;
}

#hasil {
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    text-align: center;
    display: none;
}

.lulus {
    display: block !important;
    background: #e9f8ee;
    color: #198754;
}

.tidak-lulus {
    display: block !important;
    background: #fdecec;
    color: #dc3545;
}

.nama {
    font-weight: 700;
    margin-bottom: 5px;
}

.status {
    font-size: 20px;
    font-weight: 700;
}
</style>
</head>
<body>

<div class="container">
    <h1>Cek Kelulusan</h1>
    <p class="subtitle">Masukkan data siswa untuk mengecek hasil</p>

    <label for="nama">Nama Siswa</label>
    <input type="text" id="nama" placeholder="Masukkan nama siswa">

    <label for="nilai">Nilai</label>
    <input type="number" id="nilai" placeholder="Masukkan nilai" min="0" max="100">

    <button onclick="cekKelulusan()">Cek Kelulusan</button>

    <div id="hasil">
        <div class="nama" id="hasilNama"></div>
        <div class="status" id="hasilStatus"></div>
    </div>
</div>

<script>
function cekKelulusan() {
    const nama = document.getElementById("nama").value.trim();
    const nilai = Number(document.getElementById("nilai").value);
    const hasil = document.getElementById("hasil");
    const hasilNama = document.getElementById("hasilNama");
    const hasilStatus = document.getElementById("hasilStatus");

    if (!nama || document.getElementById("nilai").value === "") {
        hasil.className = "tidak-lulus";
        hasilNama.textContent = "Data belum lengkap";
        hasilStatus.textContent = "Silakan isi nama dan nilai";
        return;
    }

    hasilNama.textContent = nama;

    if (nilai >= 75) {
        hasil.className = "lulus";
        hasilStatus.textContent = "LULUS";
    } else {
        hasil.className = "tidak-lulus";
        hasilStatus.textContent = "TIDAK LULUS";
    }
}
</script>

</body>
</html>
